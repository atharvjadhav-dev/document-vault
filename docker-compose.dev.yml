services:
  postgres:
    image: postgres:15-alpine
    container_name: vault_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-document_vault}
      POSTGRES_USER: ${DB_USER:-vault_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-vault_secure_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/src/config/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-vault_user} -d ${DB_NAME:-document_vault}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vault_network

  backend:
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_SSL: "false"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
    driver: local
