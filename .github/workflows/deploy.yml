name: Deploy Document Vault

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            echo "📂 Entering project directory..."
            cd ~/document-vault

            echo "⬇️ Pulling latest code..."
            git fetch origin
            git reset --hard origin/main

            echo "🐳 Rebuilding and starting containers..."
            docker compose up -d --build

            echo "🧹 Cleaning unused Docker images..."
            docker image prune -af

            echo "📋 Checking container status..."
            docker compose ps

            echo "🩺 Verifying container health..."
            sleep 5
            curl -fsS http://127.0.0.1:5000/api/health || (echo "❌ Backend healthcheck failed!" && exit 1)
            curl -fsS http://127.0.0.1:5173/ > /dev/null || (echo "❌ Frontend healthcheck failed!" && exit 1)

            echo "✅ Deployment and healthcheck verification completed successfully."
