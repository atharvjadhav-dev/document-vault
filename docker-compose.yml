version: '3.9'

services:
  postgres:
    image: postgres:15-alpine
    container_name: vault_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-document_vault}
      POSTGRES_USER: ${DB_USER:-vault_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-vault_secure_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/src/config/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-vault_user} -d ${DB_NAME:-document_vault}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vault_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vault_backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
    volumes:
      - uploads_data:/app/uploads
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - vault_network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:5000/api}
    container_name: vault_frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - vault_network

volumes:
  postgres_data:
    driver: local
  uploads_data:
    driver: local

networks:
  vault_network:
    driver: bridge
