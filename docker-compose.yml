services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vault_backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    volumes:
      - uploads_data:/app/uploads
    ports:
      - "127.0.0.1:5000:5000"
    networks:
      - vault_network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
    container_name: vault_frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      - backend
    networks:
      - vault_network

volumes:
  uploads_data:
    driver: local

networks:
  vault_network:
    driver: bridge
